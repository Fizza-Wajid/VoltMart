<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <link rel="stylesheet" href="productDetails.css" />
</head>
<body>

  <div class="product-container">
    <div class="product-image">
      <img src="https://via.placeholder.com/400x300" alt="Product Image" />
    </div>
    <div class="product-details">
      <div class="product-title">Sample Product Name</div>
      <div class="product-price">$49.99</div>
      <div class="product-description">
        This is a brief description of the product. It includes features, materials, or any other useful information the customer might want to know.
      </div>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </div>

</body>
</html>
